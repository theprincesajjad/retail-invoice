name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Tauri 2.x desktop builds (Windows + Mac)
  publish:
    if: startsWith(github.ref, 'refs/tags/v2')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Retail Invoice ${{ github.ref_name }}"
          releaseBody: "Local-first invoicing and inventory for Windows and Mac. Your data stays on this computer."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Classic Python CustomTkinter Windows exe (1.x)
  legacy-python-windows:
    if: startsWith(github.ref, 'refs/tags/v1')
    runs-on: windows-latest
    defaults:
      run:
        working-directory: legacy

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run unit tests
        run: python -m pytest tests -q

      - name: Build Windows exe
        shell: cmd
        run: >
          pyinstaller --name "RetailInvoice" --onefile --windowed --noconfirm --clean
          --add-data "assets;assets"
          --add-data "VERSION;."
          --add-data "CHANGELOG.md;."
          --collect-all customtkinter
          --hidden-import customtkinter
          --hidden-import pywin32
          --hidden-import PIL
          --hidden-import escpos
          --hidden-import win32print
          --hidden-import win32api
          --hidden-import reportlab
          --hidden-import reportlab.pdfgen.canvas
          --hidden-import openpyxl
          --hidden-import inventory_pdf
          main.py

      - name: Rename artifact
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION -Raw).Trim()
          New-Item -ItemType Directory -Force -Path dist-upload | Out-Null
          Copy-Item "dist\RetailInvoice.exe" "dist-upload\RetailInvoice-$ver-Windows.exe"

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Retail Invoice ${{ github.ref_name }}
          body_path: legacy/RELEASE_NOTES.md
          draft: false
          files: legacy/dist-upload/RetailInvoice-*-Windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
